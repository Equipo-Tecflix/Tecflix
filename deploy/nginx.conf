# Balanceador para los dos nodos de streaming (V2.0).
# Uso:  nginx -c /ruta/a/nginx.conf   (o copiar el bloque http a /etc/nginx/conf.d/)
events { worker_connections 4096; }

http {
    upstream tecflix_streaming {
        least_conn;
        server 192.168.1.10:8083 max_fails=2 fail_timeout=10s;   # nodo A  (CAMBIAR IP)
        server 192.168.1.11:8083 max_fails=2 fail_timeout=10s;   # nodo B  (CAMBIAR IP)
        keepalive 64;
    }

    server {
        listen 8080;
        client_max_body_size 2g;

        location / {
            proxy_pass http://tecflix_streaming;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;

            # Failover: si un nodo cae, responde 5xx, o aún no tiene la copia replicada (404),
            # se reintenta automáticamente en el otro nodo.
            proxy_next_upstream error timeout http_502 http_503 http_504 http_404;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;

            # Subidas grandes: no bufferizar el video completo en el balanceador.
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }

        # El endpoint interno de replicación NUNCA debe quedar expuesto por el balanceador.
        location /internal/ { return 403; }
    }
}

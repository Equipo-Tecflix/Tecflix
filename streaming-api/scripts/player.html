<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tecflix – prueba de reproducción DASH</title>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
  <style>body{font-family:sans-serif;max-width:900px;margin:2rem auto}video{width:100%;background:#000}</style>
</head>
<body>
  <h1>Prueba de reproducción (Shaka Player)</h1>
  <label>API: <input id="api" size="30" value="http://localhost:8083"></label>
  <label>Video id: <input id="vid" size="16" value="demo1"></label>
  <button id="go">Reproducir</button>
  <p id="msg"></p>
  <video id="video" controls autoplay></video>
  <script>
    document.getElementById('go').onclick = async () => {
      const msg = document.getElementById('msg');
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) { msg.textContent = 'Navegador no soportado'; return; }
      const player = new shaka.Player();
      await player.attach(document.getElementById('video'));
      player.addEventListener('error', e => msg.textContent = 'Error Shaka: ' + e.detail.code);
      const url = `${document.getElementById('api').value}/videos/${document.getElementById('vid').value}/manifest.mpd`;
      try { await player.load(url); msg.textContent = 'Reproduciendo ' + url; }
      catch (e) { msg.textContent = 'No se pudo cargar: ' + (e.code || e); }
    };
  </script>
</body>
</html>

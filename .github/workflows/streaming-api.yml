name: streaming-api

on:
  workflow_dispatch:
  push:
    paths: ['streaming-api/**', '.github/workflows/streaming-api.yml']
  pull_request:
    paths: ['streaming-api/**']

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streaming-api
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ffmpeg gcovr
      - name: Compilar (con cobertura)
        run: |
          cmake -B build-cov -DTECFLIX_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-cov -j$(nproc)
      - name: Pruebas unitarias
        run: ./build-cov/tecflix_tests
      - name: Cobertura (mínimo 90%)
        run: |
          gcovr -r . build-cov --filter 'src/' --exclude 'src/main.cpp' \
                --print-summary --xml coverage.xml --fail-under-line 90
      - uses: actions/upload-artifact@v4
        with: { name: coverage-streaming, path: streaming-api/coverage.xml }

  package:
    needs: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streaming-api
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Compilar Release
        run: |
          cmake -B build -DTECFLIX_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: tecflix-streaming-linux-x64
          path: streaming-api/build/tecflix_streaming
